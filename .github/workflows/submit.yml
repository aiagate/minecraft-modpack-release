name: Manual CurseForge submission
on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Actually submit to CurseForge (false = offline dry-run)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: curseforge-submit
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require one tracked export
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(packs/*.zip)
          ((${#packs[@]} == 1)) || { echo 'Exactly one export ZIP is required.' >&2; exit 1; }
      - name: Offline dry-run
        if: ${{ !inputs.submit }}
        run: python3 scripts/release.py --zip packs/*.zip
      - name: Validate and submit identical bytes once
        if: ${{ inputs.submit }}
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python3 scripts/release.py --zip packs/*.zip --submit
