name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q scripts tests
      - name: Keep ZIP binaries out of Git
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          if any(p.lower().endswith(b'.zip') for p in paths):
              raise SystemExit('ZIP binaries belong in Release assets or Actions artifacts, not Git.')
          PY
      - name: Build local reconstruction draft offline
        run: python3 scripts/local_pack.py --output "$RUNNER_TEMP/okd-server-modpack-import-preview.zip"
      - name: Write checksum for import draft
        run: |
          cd "$RUNNER_TEMP"
          sha256sum okd-server-modpack-import-preview.zip > okd-server-modpack-import-preview.zip.sha256
      - name: Keep import draft as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: okd-server-modpack-import-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/okd-server-modpack-import-preview.zip
            ${{ runner.temp }}/okd-server-modpack-import-preview.zip.sha256
          retention-days: 14
          if-no-files-found: error
